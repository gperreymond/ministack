name: Build and Release binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: ministack-linux
          # intel macs (and apple silicon through rosetta, for older install scripts)
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: ministack-macos
          # apple silicon macs, native
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: ministack-macos-arm64

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: '1.84.0'
          override: true
          target: ${{ matrix.target }}

      - name: Set up Clang on macOS
        if: matrix.os == 'macos-latest'
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Build the project in release mode
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create the release if needed, and upload the binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cp ./target/${{ matrix.target }}/release/ministack ./${{ matrix.asset_name }}
          # both matrix jobs may try to create the release, the loser just reuses it
          gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" --title "Release $TAG" --verify-tag \
            || gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null
          gh release upload "$TAG" ./${{ matrix.asset_name }} --repo "${{ github.repository }}" --clobber
