name: 'hashistack'
datacenter: 'localhost'

services:
  consul:
    enabled: true
    servers:
      - name: 'consul'
  vault:
    enabled: true
  nomad:
    enabled: true
    servers:
      - name: 'server'
    clients:
      - name: 'worker'

# traefik in front of the services of the jobs: http://<service>.localhost:8080
ingress:
  enabled: true
