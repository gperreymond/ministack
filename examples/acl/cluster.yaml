name: 'acl'
datacenter: 'localhost'

# consul + vault + nomad with acl enabled
# tokens: eval "$(ministack --config examples/acl/cluster.yaml --env)"
services:
  consul:
    enabled: true
    config:
      acl:
        enabled: true
        # token: '22222222-2222-2222-2222-222222222222'   # management token (uuid)
    servers:
      - name: 'consul'
  vault:
    enabled: true
    mode: 'raft'
  nomad:
    enabled: true
    config:
      acl:
        enabled: true
        # token: '11111111-1111-1111-1111-111111111111'   # management token (uuid)
    servers:
      - name: 'server'
    clients:
      - name: 'worker'
