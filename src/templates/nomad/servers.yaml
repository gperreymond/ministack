{%- if services.nomad.servers %}
services:
  {%- for item in services.nomad.servers %}
  {{ datacenter }}-{{ item.name }}:
    image: '{{ hashibase_repository }}:{{ hashibase_tag }}'
    container_name: '{{ datacenter }}-{{ item.name }}'
    hostname: '{{ datacenter }}-{{ item.name }}'
    privileged: 'true'
    environment:
      MINISTACK: 'true'
      NOMAD_ADDR: '{{ nomad_scheme }}://{{ item.ip }}:4646'
      {%- if nomad_acl %}
      NOMAD_TOKEN: '{{ nomad_token }}'
      {%- endif %}
      {%- if nomad_tls %}
      NOMAD_CACERT: '/ministack/tls/ca.pem'
      {%- endif %}
      {%- if services.nomad.version %}
      NOMAD_VERSION: '{{ services.nomad.version }}'
      {%- endif %}
      {%- if services.consul.enabled %}
      CONSUL_HTTP_ADDR: '{{ consul_scheme }}://127.0.0.1:{{ consul_port }}'
      {%- if consul_tls %}
      CONSUL_CACERT: '/ministack/tls/ca.pem'
      {%- endif %}
      {%- if consul_acl %}
      CONSUL_HTTP_TOKEN: '{{ consul_token }}'
      {%- endif %}
      {%- if services.consul.version %}
      CONSUL_VERSION: '{{ services.consul.version }}'
      {%- endif %}
      {%- endif %}
    {%- if (services.consul.enabled and services.consul.servers) or services.vault.enabled %}
    depends_on:
      {%- if services.consul.enabled and services.consul.servers %}
      {%- for consul_server in services.consul.servers %}
      {{ datacenter }}-{{ consul_server.name }}:
        condition: 'service_healthy'
      {%- endfor %}
      {%- endif %}
      {%- if services.vault.enabled %}
      {{ datacenter }}-vault:
        condition: 'service_healthy'
      {%- endif %}
    {%- endif %}
    post_start:
      # wait for systemd (pid 1) to be up before installing and starting the services
      - command: ['bash', '-c', 'for i in $$(seq 1 120); do systemctl is-system-running 2>/dev/null | grep -qE "running|degraded" && break; sleep 0.5; done; start-ministack']
    healthcheck:
      test: ["CMD-SHELL", "curl -sfk $${NOMAD_ADDR}/v1/agent/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s
    {%- if (loop.first and nomad_host_port) or item.ports %}
    ports:
      {%- if loop.first and nomad_host_port %}
      - '127.0.0.1:{{ nomad_host_port }}:4646'
      {%- endif %}
      {%- if item.ports %}
      {%- for port in item.ports %}
      - '{{ port }}'
      {%- endfor %}
      {%- endif %}
    {%- endif %}
    labels:
      - 'ministack/nomad=server'
      {%- if services.nomad.config.server.labels %}
      {%- for label in services.nomad.config.server.labels %}
      - '{{ label }}'
      {%- endfor %}
      {%- endif %}
      {%- if item.labels %}
      {%- for label in item.labels %}
      - '{{ label }}'
      {%- endfor %}
      {%- endif %}
    volumes:
      - '../configurations/nomad/config.hcl:/nomad/config/config.hcl'
      - '../configurations/nomad/base.hcl:/etc/nomad.d/config/00-base.hcl'
      - '../configurations/nomad/server.hcl:/etc/nomad.d/config/00-server.hcl'
      - '{{ item.name }}_data:/nomad/data'
      - '{{ item.name }}_docker_data:/var/lib/docker'
      {%- if any_tls %}
      - '../tls:/ministack/tls:ro'
      {%- endif %}
      {%- if services.consul.enabled %}
      - '../configurations/consul/config.hcl:/consul/config/config.hcl'
      - '../configurations/consul/client.hcl:/etc/consul.d/config/00-client.hcl'
      - '{{ item.name }}_consul_data:/consul/data'
      {%- endif %}
      # local volumes
      {%- if services.nomad.config.server.local_volumes %}
      {%- for volume in services.nomad.config.server.local_volumes %}
      - '../../{{ volume }}'
      {%- endfor %}
      {%- endif %}
      {%- if item.local_volumes %}
      {%- for volume in item.local_volumes %}
      - '../../{{ volume }}'
      {%- endfor %}
      {%- endif %}
    networks:
      ministack:
        ipv4_address: '{{ item.ip }}'
  {%- endfor %}
{%- endif %}

{%- if services.nomad.servers %}
volumes:
  {%- for item in services.nomad.servers %}
  {{ item.name }}_data: {}
  {{ item.name }}_docker_data: {}
  {%- if services.consul.enabled %}
  {{ item.name }}_consul_data: {}
  {%- endif %}
  {%- endfor %}
{%- endif %}
