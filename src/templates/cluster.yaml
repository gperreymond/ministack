name: '{{ name }}'

{%- if 
  services.nomad.enabled or
  services.consul.enabled or
  services.vault.enabled or
  plugins
%}
include:
  # CONSUL
  {%- if services.consul.enabled and services.consul.servers %}
  - 'consul/servers.yaml'
  {%- endif %}
  # VAULT
  {%- if services.vault.enabled %}
  - 'vault/server.yaml'
  {%- endif %}
  # NOMAD
  {%- if services.nomad.servers %}
  - 'nomad/servers.yaml'
  {%- endif %}
  {%- if services.nomad.clients %}
  - 'nomad/clients.yaml'
  {%- endif %}
  # BOOTSTRAP
  {%- if needs_bootstrap %}
  - 'bootstrap.yaml'
  {%- endif %}
  # INGRESS
  {%- if ingress_enabled %}
  - 'ingress.yaml'
  {%- endif %}
  # PLUGINS
  {%- if plugins %}
  {%- for item in plugins %}
  - '../{{ item }}'
  {%- endfor %}
  {%- endif %}
{%- else %}
include: []
{%- endif %}

{%- if network.external.enabled %}
networks:
  ministack:
    external: true
    name: '{{ name }}_ministack'
{%- else %}
networks:
  ministack:
    driver: 'bridge'
    ipam:
      config:
        - subnet: '{{ network_subnet }}/24'
{%- endif %}