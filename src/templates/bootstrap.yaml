{%- if needs_bootstrap %}
services:
  # one place for everything that needs the running cluster: nomad acl bootstrap,
  # consul and vault setup for the nomad workload identities, vault init/unseal (raft)
  # it stays alive and healthy, so '--start' ('docker compose up --wait') returns
  # only when the whole cluster is ready
  {{ datacenter }}-bootstrap:
    image: '{{ hashibase_repository }}:{{ hashibase_tag }}'
    container_name: '{{ datacenter }}-bootstrap'
    init: true
    entrypoint: ['bash', '-c', 'bash /ministack/bootstrap.sh && touch /tmp/ready && exec sleep infinity']
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 2s
      timeout: 2s
      retries: 90
    volumes:
      - './scripts/bootstrap.sh:/ministack/bootstrap.sh:ro'
      {%- if any_tls %}
      - './tls:/ministack/tls:ro'
      {%- endif %}
      {%- if vault_raft %}
      # unseal key and initial root token, keep it: without it the vault data is lost
      - 'vault_keys:/ministack/keys'
      {%- endif %}
    depends_on:
      {%- if services.consul.enabled and services.consul.servers %}
      {%- for item in services.consul.servers %}
      {{ datacenter }}-{{ item.name }}:
        condition: 'service_healthy'
      {%- endfor %}
      {%- endif %}
      {%- if services.vault.enabled %}
      {{ datacenter }}-vault:
        condition: 'service_healthy'
      {%- endif %}
      {%- if with_nomad %}
      {%- for item in services.nomad.servers %}
      {{ datacenter }}-{{ item.name }}:
        condition: 'service_healthy'
      {%- endfor %}
      {%- endif %}
    networks:
      ministack: {}
  {%- if vault_raft %}

volumes:
  vault_keys: {}
  {%- endif %}
{%- endif %}
