{%- set nomad_tls = false -%}
{%- if services.nomad.enabled -%}{%- if services.nomad.config.tls -%}{%- set nomad_tls = true -%}{%- endif -%}{%- endif -%}
{%- set consul_tls = false -%}
{%- if services.consul.enabled -%}{%- if services.consul.config.tls -%}{%- set consul_tls = true -%}{%- endif -%}{%- endif -%}
{%- set vault_tls = false -%}
{%- if services.vault.enabled -%}{%- if services.vault.config.tls -%}{%- set vault_tls = true -%}{%- endif -%}{%- endif -%}
{%- set any_tls = nomad_tls or consul_tls or vault_tls -%}
{%- set nomad_scheme = "http" -%}{%- if nomad_tls -%}{%- set nomad_scheme = "https" -%}{%- endif -%}
{%- set consul_scheme = "http" -%}{%- set consul_port = 8500 -%}
{%- if consul_tls -%}{%- set consul_scheme = "https" -%}{%- set consul_port = 8501 -%}{%- endif -%}
{%- set vault_scheme = "http" -%}{%- if vault_tls -%}{%- set vault_scheme = "https" -%}{%- endif -%}
{%- set nomad_acl = false -%}
{%- if services.nomad.config.acl.enabled -%}{%- set nomad_acl = true -%}{%- endif -%}
{%- set nomad_token = "11111111-1111-1111-1111-111111111111" -%}
{%- if services.nomad.config.acl.token -%}{%- set nomad_token = services.nomad.config.acl.token -%}{%- endif -%}
{%- set consul_acl = false -%}
{%- if services.consul.enabled -%}{%- if services.consul.config.acl.enabled -%}{%- set consul_acl = true -%}{%- endif -%}{%- endif -%}
{%- set consul_token = "22222222-2222-2222-2222-222222222222" -%}
{%- if services.consul.config.acl.token -%}{%- set consul_token = services.consul.config.acl.token -%}{%- endif -%}
{%- set network_subnet = "10.1.0.0" -%}
{%- if network.subnet -%}{%- set network_subnet = network.subnet -%}{%- endif -%}
{%- set network_prefix = network_subnet | split(pat=".") | slice(start=0, end=3) | join(sep=".") -%}
{%- set hashibase_repository = "ghcr.io/gperreymond/hashibase" -%}
{%- if  hashibase.repository -%}{%- set hashibase_repository = hashibase.repository -%}{%- endif -%}
{%- set hashibase_tag = "base-1.3.0" -%}
{%- if  hashibase.tag -%}{%- set hashibase_tag = hashibase.tag -%}{%- endif -%}

{%- if services.consul.enabled and services.consul.servers %}
services:
  {%- for item in services.consul.servers %}
  {%- set node_number = 20 + loop.index %}
  {%- set node_ip = network_prefix ~ "." ~ node_number %}
  {{ datacenter }}-{{ item.name }}:
    image: '{{ hashibase_repository }}:{{ hashibase_tag }}'
    container_name: '{{ datacenter }}-{{ item.name }}'
    hostname: '{{ datacenter }}-{{ item.name }}'
    privileged: 'true'
    environment:
      MINISTACK: 'true'
      CONSUL_HTTP_ADDR: '{{ consul_scheme }}://127.0.0.1:{{ consul_port }}'
      {%- if consul_tls %}
      CONSUL_CACERT: '/ministack/tls/ca.pem'
      {%- endif %}
      {%- if consul_acl %}
      CONSUL_HTTP_TOKEN: '{{ consul_token }}'
      {%- endif %}
      {%- if services.consul.version %}
      CONSUL_VERSION: '{{ services.consul.version }}'
      {%- endif %}
    post_start:
      # wait for systemd (pid 1) to be up before installing and starting the services
      - command: ['bash', '-c', 'for i in $$(seq 1 120); do systemctl is-system-running 2>/dev/null | grep -qE "running|degraded" && break; sleep 0.5; done; start-ministack']
    healthcheck:
      # healthy only when a leader is elected
      test: ["CMD-SHELL", "curl -sfk $${CONSUL_HTTP_ADDR}/v1/status/leader | grep -q ':'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s
    {%- set host_port = 8500 %}
    {%- if services.consul.config.server.host_port is defined %}{% set host_port = services.consul.config.server.host_port %}{% endif %}
    {%- if (loop.first and host_port) or item.ports %}
    ports:
      {%- if loop.first and host_port %}
      - '127.0.0.1:{{ host_port }}:{{ consul_port }}'
      {%- endif %}
      {%- if item.ports %}
      {%- for port in item.ports %}
      - '{{ port }}'
      {%- endfor %}
      {%- endif %}
    {%- endif %}
    labels:
      - 'ministack/consul=server'
      {%- if services.consul.config.server.labels %}
      {%- for label in services.consul.config.server.labels %}
      - '{{ label }}'
      {%- endfor %}
      {%- endif %}
      {%- if item.labels %}
      {%- for label in item.labels %}
      - '{{ label }}'
      {%- endfor %}
      {%- endif %}
    volumes:
      - '../configurations/consul/config.hcl:/consul/config/config.hcl'
      - '../configurations/consul/server.hcl:/etc/consul.d/config/00-server.hcl'
      - '{{ item.name }}_consul_data:/consul/data'
      {%- if any_tls %}
      - '../tls:/ministack/tls:ro'
      {%- endif %}
      # local volumes
      {%- if services.consul.config.server.local_volumes %}
      {%- for volume in services.consul.config.server.local_volumes %}
      - '../../{{ volume }}'
      {%- endfor %}
      {%- endif %}
      {%- if item.local_volumes %}
      {%- for volume in item.local_volumes %}
      - '../../{{ volume }}'
      {%- endfor %}
      {%- endif %}
    networks:
      ministack:
        ipv4_address: '{{ node_ip }}'
  {%- endfor %}

volumes:
  {%- for item in services.consul.servers %}
  {{ item.name }}_consul_data: {}
  {%- endfor %}
{%- endif %}
